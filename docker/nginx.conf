# TLS termination (SSL) + WebSocket proxying. Put fullchain.pem / privkey.pem in docker/certs/
# (e.g. from Let's Encrypt, or a self-signed pair for testing).
server { listen 80; return 301 https://$host$request_uri; }
server {
  listen 443 ssl http2;
  ssl_certificate /etc/nginx/certs/fullchain.pem; ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  location /ws { proxy_pass http://app:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 3600s; }
  location / { proxy_pass http://app:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
}
